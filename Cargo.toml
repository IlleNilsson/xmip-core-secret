# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-secret"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-secret"
description = "The key home: data keys wrapped under a named key-encryption key, AES-256-GCM sealing and the keyed hash, once (ADR-0063)."
publish = false

[lib]
# A host crate: the technologies mount beside this source (ADR-0049).
path = ".src/lib.rs"

[dependencies]
# The crypto xmip-core-library-tls already builds, through rustls's default
# provider: AES-256-GCM, HKDF and HMAC-SHA-256 from one audited library rather
# than a second one for storage (ADR-0063 clause 2). Its assembler comes
# prebuilt (prebuilt-nasm, as rustls enables it), so a Windows build needs no
# NASM.
aws-lc-rs = { version = "1", features = ["prebuilt-nasm"] }
# Key material is overwritten when it is dropped, not left for the allocator.
zeroize = "1"

[features]
# A key store held in memory, from the capability's `fixture` module, for the
# tests of what uses a key store. Enabled from dev-dependencies only, so it is
# never in a production build.
test-support = []

[lints.rust]
# forbid, not deny: a module has no business writing unsafe. The one exception
# in the estate is xmip-core-abi, which holds the extern "C" vtable over
# include/xmip_module.h and lowers this to deny with a reason at the call site.
unsafe_code = "forbid"

[lints.clippy]
# Warned, never denied. doc/governance/rust-style.md section 3: a function
# length gate was tried in this estate's PowerShell and produced a sixteen-entry
# waiver list while catching nothing. The number worth reading is branches, and
# clippy prints both.
too_many_lines = "warn"

# The ones that catch real defects rather than taste.
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "warn"
expect_used = "allow"

[profile.dev.package."*"]
opt-level = 3
